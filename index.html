<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chelsea Ogbonna | Interactive Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#edf2fb;
  --card:#d7e3fc;
  --accent:#abc4ff;
  --text:#1f2937;
  --border:#c1d3fe;
  --card-hover: #ccdbfd;
  --shadow: 0 12px 30px rgba(0, 0, 0, .06);
  --primary-glow: rgba(81, 113, 230, 0.15);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  line-height: 1.6;
}

/* =========================
   NAV (UNCHANGED NAVIGATION)
========================= */
nav{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:min(1100px,92%);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}

.logo{
  font-weight:800;
  font-size:18px;
  color:var(--text);
  text-decoration:none;
}

.nav-links{
  display:flex;
  gap:10px;
  padding:8px;
  border-radius:999px;
  background:rgba(255, 255, 255, .78);
  backdrop-filter:blur(16px);
  border:1px solid rgba(193, 211, 254, .45);
  box-shadow:0 12px 35px rgba(0,0,0,.10);
}

.nav-links a{
  text-decoration:none;
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  transition:.25s;
  font-weight:500;
}

.nav-links a:hover{
  background:var(--accent);
  transform:translateY(-2px);
}

/* =========================
========================= */
.hero{
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  align-items: center;
  padding: 0 10%;
  position: relative;
  gap: 40px;
}

.hero:before{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  background:var(--accent);
  filter:blur(150px);
  opacity:.35;
  left:-200px;
  top:-150px;
}

.hero-text{position:relative; z-index:2}

.hero h1{
  font-size:72px;
  font-weight: 800;
  margin:0 0 10px 0;
  line-height: 1.1;
}

.hero h2{
  font-size: 24px;
  font-weight:600;
  color: #5171e6;
  margin: 0 0 20px 0;
}

.hero p {
  font-size: 18px;
  color: #4b5563;
  max-width: 580px;
  margin-bottom: 35px;
}

.cta-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 15px;
}

.button{
  display:inline-flex;
  align-items: center;
  padding:14px 28px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius:14px;
  text-decoration:none;
  color: var(--text);
  font-weight:700;
  transition: .3s;
  box-shadow: var(--shadow);
  cursor: pointer;
}

.button.primary {
  background: var(--accent);
  color: var(--text);
}

.button:hover{
  transform:translateY(-3px);
  background: var(--card-hover);
  box-shadow: 0 15px 30px rgba(0, 0, 0, .1);
}

.resume-link {
  color: #4b5563;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 10px;
  transition: .2s;
}

.resume-link:hover {
  color: #5171e6;
  text-decoration: underline;
}

.hero-image {
  display: flex;
  justify-content: center;
}

.hero-image img{
  width:360px;
  height: 450px;
  object-fit: cover;
  max-width:100%;
  border-radius:32px;
  border: 8px solid white;
  box-shadow:0 30px 70px rgba(0,0,0,.12);
  transition:.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hero-image img:hover{
  transform:rotate(2deg) scale(1.03) translateY(-5px);
}

/* =========================
   SECTIONS GENERAL
========================= */
.section{
  padding:100px 10%;
  max-width: 1300px;
  margin: auto;
}

.section-title{
  text-align:center;
  font-size:42px;
  font-weight: 800;
  margin-bottom:12px;
}

.section-subtitle {
  text-align: center;
  color: #4b5563;
  font-size: 16px;
  max-width: 600px;
  margin: 0 auto 60px auto;
}

/* =========================
   NEW: ABOUT & INTERESTS SECTION
========================= */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  align-items: flex-start;
  margin-top: 40px;
}

.about-text h3 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 20px;
  color: #3b5cc4;
}

.about-text p {
  color: #4b5563;
  font-size: 16px;
  line-height: 1.75;
  margin-bottom: 20px;
}

.about-highlight {
  border-left: 4px solid var(--accent);
  padding-left: 20px;
  font-style: italic;
  color: #374151;
  font-weight: 500;
  margin: 25px 0;
}

.interests-container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.interest-item {
  background: white;
  padding: 24px;
  border-radius: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: .3s;
}

.interest-item:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
  box-shadow: 0 15px 30px rgba(81, 113, 230, 0.08);
}

.interest-icon {
  font-size: 32px;
  margin-bottom: 12px;
  display: block;
}

.interest-item h4 {
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 8px 0;
}

.interest-item p {
  font-size: 13.5px;
  color: #6b7280;
  margin: 0;
  line-height: 1.5;
}

/* =========================
   NEW: DYNAMIC COMPANY ALIGNER
========================= */
.aligner-card {
  background: white;
  border-radius: 28px;
  border: 1px solid var(--border);
  padding: 35px;
  margin-bottom: 40px;
  box-shadow: var(--shadow);
}

.aligner-header {
  text-align: center;
  margin-bottom: 30px;
}

.aligner-header h3 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 8px;
}

.aligner-header p {
  font-size: 14.5px;
  color: #6b7280;
}

.aligner-selectors {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.aligner-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 20px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  color: var(--text);
  transition: .25s;
}

.aligner-btn.active, .aligner-btn:hover {
  background: #3b5cc4;
  color: white;
  border-color: #3b5cc4;
  box-shadow: 0 8px 20px rgba(59, 92, 196, 0.25);
  transform: translateY(-2px);
}

.alignment-banner {
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: #3b5cc4;
  background: var(--bg);
  padding: 12px 25px;
  border-radius: 12px;
  margin-top: 20px;
  border: 1px dashed var(--border);
}

/* HIGHLIGHT STATS */
.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

.stat{
  flex: 1;
  min-width:250px;
  background:var(--card);
  padding:35px 30px;
  border-radius:24px;
  text-align:center;
  box-shadow: var(--shadow);
  transition:.3s;
  border: 1px solid rgba(255,255,255,0.4);
}

.stat:hover{
  transform:translateY(-8px);
  background: var(--card-hover);
}

.stat h3{
  font-size:48px;
  font-weight: 800;
  margin:0 0 5px 0;
  color: #3b5cc4;
}

.stat p {
  margin: 0;
  font-weight: 600;
  color: var(--text);
  font-size: 16px;
}

/* =========================
========================= */
.projects{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap:30px;
}

.project{
  background:var(--card);
  border-radius:24px;
  overflow:hidden;
  transition:.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.4);
  display: flex;
  flex-direction: column;
}

.project:hover{
  transform:translateY(-8px);
  background: var(--card-hover);
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.project-img{
  height:200px;
  background:#2d3138;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:700;
  font-size: 20px;
  letter-spacing: 1px;
}

.project-content{
  padding:30px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.project-content h3{
  font-size: 22px;
  margin: 0 0 10px 0;
  font-weight: 800;
}

.project-content p{
  color: #4b5563;
  font-size: 15px;
  margin: 0 0 20px 0;
  line-height: 1.65;
}

.alignment-fit-badge {
  background: white;
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: #3b5cc4;
  margin-bottom: 20px;
  margin-top: auto;
}

.project-link {
  color: #5171e6;
  text-decoration: none;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 15px;
}

/* REAL LIFE EXPERIENCE SECTION (PROJECT CURE) */
.experience-wrapper {
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 40px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  align-items: center;
  box-shadow: var(--shadow);
}

.exp-header h3 {
  font-size: 26px;
  margin: 0 0 4px 0;
}

.exp-header h4 {
  font-size: 16px;
  font-weight: 600;
  color: #5171e6;
  text-transform: uppercase;
  margin: 0 0 20px 0;
  letter-spacing: 0.5px;
}

.exp-header p {
  color: #4b5563;
  font-size: 15px;
  line-height: 1.7;
  margin: 0;
}

.exp-details {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
}

.exp-details h5 {
  margin: 0 0 12px 0;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.exp-details ul {
  padding: 0;
  margin: 0;
  list-style: none;
}

.exp-details li {
  position: relative;
  padding-left: 20px;
  margin-bottom: 12px;
  font-size: 14px;
  color: #4b5563;
}

.exp-details li::before {
  content: "▪";
  position: absolute;
  left: 4px;
  color: #5171e6;
}

/* RESEARCH TAGS */
.tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  max-width: 800px;
  margin: auto;
}

.tag{
  background:var(--card);
  padding:14px 24px;
  border-radius:999px;
  font-weight: 600;
  transition:.25s;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.4);
}

.tag:hover{
  background:var(--accent);
  transform:translateY(-4px);
}

/* TIMELINE */
.timeline{
  max-width:850px;
  margin:auto;
}

.timeline-item{
  background:var(--card);
  padding:25px;
  border-radius:20px;
  margin-bottom:20px;
  transition:.3s;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 20px;
  border: 1px solid rgba(255,255,255,0.4);
}

.timeline-item:hover{
  transform:translateX(10px);
  background: var(--card-hover);
}

.timeline-year {
  font-size: 20px;
  font-weight: 800;
  color: #3b5cc4;
  min-width: 60px;
}

.timeline-desc {
  font-size: 16px;
  font-weight: 500;
}

/* ==========================================
   INTERACTIVE CAMPUS HUB (REPLACING ALERTS)
========================================== */
.campus{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  margin-bottom: 30px;
}

.lab{
  background:var(--card);
  padding:35px 25px;
  border-radius:24px;
  text-align:center;
  cursor:pointer;
  transition:.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.4);
}

.lab h3 {
  margin: 0 0 10px 0;
  font-size: 18px;
}

.lab p {
  margin: 0;
  font-size: 13px;
  color: #4b5563;
  opacity: 0;
  transform: translateY(10px);
  transition: .3s;
}

.lab:hover{
  transform:translateY(-10px);
  background:#ccdbfd;
  box-shadow: 0 20px 35px rgba(0,0,0,0.08);
}

.lab:hover p {
  opacity: 1;
  transform: translateY(0);
}

/* Elegant built-in details drawer */
.campus-details-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 35px;
  box-shadow: var(--shadow);
  margin-top: 30px;
  transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
  display: none;
}

.campus-details-box.active {
  display: block;
  animation: slideDownFade 0.4s forwards;
}

@keyframes slideDownFade {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

.campus-details-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--bg);
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.campus-details-header h3 {
  font-size: 22px;
  font-weight: 800;
  color: #3b5cc4;
  margin: 0;
}

.close-campus-btn {
  background: var(--bg);
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 800;
  color: #4b5563;
  transition: .2s;
}

.close-campus-btn:hover {
  background: var(--accent);
  color: var(--text);
}

.campus-content-grid {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 30px;
}

.campus-content-main p {
  color: #4b5563;
  font-size: 15.5px;
  line-height: 1.7;
}

.campus-content-sidebar {
  background: var(--bg);
  padding: 20px;
  border-radius: 16px;
  border: 1px solid var(--border);
}

.campus-content-sidebar h4 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 0 0 10px 0;
  color: #3b5cc4;
}

.campus-content-sidebar ul {
  padding-left: 20px;
  margin: 0;
}

.campus-content-sidebar li {
  font-size: 13.5px;
  color: #4b5563;
  margin-bottom: 8px;
}

/* ==========================================
   NEW: LET'S CONNECT CONSOLE
========================================== */
.connect-container {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 50px;
  margin-top: 40px;
}

.connect-info h3 {
  font-size: 28px;
  font-weight: 800;
  color: #3b5cc4;
  margin-bottom: 15px;
}

.connect-info p {
  color: #4b5563;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 30px;
}

.contact-meta {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 15px;
}

.meta-icon {
  width: 44px;
  height: 44px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.meta-text span {
  display: block;
  font-size: 12px;
  color: #6b7280;
  text-transform: uppercase;
  font-weight: 600;
}

.meta-text a, .meta-text p {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
}

.meta-text a:hover {
  color: #5171e6;
  text-decoration: underline;
}

.connect-console {
  background: white;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 35px;
  box-shadow: var(--shadow);
}

.console-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.console-field label {
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #3b5cc4;
}

.console-field input, .console-field textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--text);
  outline: none;
  transition: .25s;
}
